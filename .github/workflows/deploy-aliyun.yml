name: Deploy to Aliyun

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Inject sensitive files from private repo
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_REPO_PAT }}
        run: |
          git clone --depth 1 "https://oauth2:${SECRETS_PAT}@github.com/milaotou-tools/secrets.git" /tmp/secrets-inject
          cp -v /tmp/secrets-inject/title-clinic/system-prompt.txt . 2>/dev/null || echo "system-prompt.txt not in secrets"
          cp -v /tmp/secrets-inject/title-clinic/expert-methodology.md . 2>/dev/null || echo "expert-methodology.md not in secrets"
          echo "Secrets injected"

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.ALIYUN_SSH_KEY }}

      - name: Trust server host key
        env:
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          SSH_PORT="${ALIYUN_PORT:-22}"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$SSH_PORT" -H "${{ secrets.ALIYUN_HOST }}" >> ~/.ssh/known_hosts

      - name: Tar and SCP source
        env:
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
        run: |
          SSH_PORT="${ALIYUN_PORT:-22}"
          USER_HOST="${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}"

          tar --exclude='.git' --exclude='node_modules' --exclude='.env' --exclude='expert-sources' \
            --exclude='*.docx' --exclude='*.log' \
            -czf /tmp/deploy.tar.gz .

          scp -P "$SSH_PORT" /tmp/deploy.tar.gz "$USER_HOST:/tmp/deploy.tar.gz"

      - name: Restart service on server
        env:
          ALIYUN_PORT: ${{ secrets.ALIYUN_PORT }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SECRETS_PAT: ${{ secrets.SECRETS_REPO_PAT }}
        run: |
          SSH_PORT="${ALIYUN_PORT:-22}"
          ssh -p "$SSH_PORT" "${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}" '
          set -e

          # Kill old process
          pm2 delete title-clinic 2>/dev/null || true
          pm2 save --force
          sleep 2
          fuser -k 3006/tcp 2>/dev/null || true
          sleep 2

          APP_DIR=/www/wwwroot/title-clinic
          mkdir -p "$APP_DIR"

          cd "$APP_DIR"

          # Extract source over existing app files (preserve .env.local and node_modules).
          # Do not wipe the app directory here: the project rule forbids batch deletion.
          if [ -f .env.local ]; then
            cp .env.local /tmp/title-clinic-env-backup
          fi

          tar -xzf /tmp/deploy.tar.gz

          # Restore or create .env.local
          if [ -f /tmp/title-clinic-env-backup ]; then
            cp /tmp/title-clinic-env-backup .env.local
          fi

          # Always ensure latest API key
          if [ -f .env.local ]; then
            sed -i "s/^DEEPSEEK_API_KEY=.*/DEEPSEEK_API_KEY='"$DEEPSEEK_KEY"'/" .env.local
          else
            echo "DEEPSEEK_API_KEY='"$DEEPSEEK_KEY"'" > .env.local
            echo "DEEPSEEK_MODEL=deepseek-v4-pro" >> .env.local
            echo "DEEPSEEK_BASE_URL=https://api.deepseek.com" >> .env.local
            echo "PORT=3006" >> .env.local
          fi
          if grep -q "^DEEPSEEK_MODEL=" .env.local; then
            sed -i "s|^DEEPSEEK_MODEL=.*|DEEPSEEK_MODEL=deepseek-v4-pro|" .env.local
          else
            echo "DEEPSEEK_MODEL=deepseek-v4-pro" >> .env.local
          fi
          if grep -q "^DEEPSEEK_BASE_URL=" .env.local; then
            sed -i "s|^DEEPSEEK_BASE_URL=.*|DEEPSEEK_BASE_URL=https://api.deepseek.com|" .env.local
          else
            echo "DEEPSEEK_BASE_URL=https://api.deepseek.com" >> .env.local
          fi
          if grep -q "^PORT=" .env.local; then
            sed -i "s|^PORT=.*|PORT=3006|" .env.local
          else
            echo "PORT=3006" >> .env.local
          fi

          # Start
          pm2 start node --name title-clinic -- server.js
          pm2 save
          sleep 2
          curl -fsS http://127.0.0.1:3006/api/health

          echo "=== PM2 status ==="
          pm2 list

          echo "=== PM2 error logs ==="
          cat /root/.pm2/logs/title-clinic-error.log 2>/dev/null | tail -20 || echo "no error log"

          # Fix Nginx reverse proxy for 8084 -> 3006
          PROXY_DIR="/www/server/panel/vhost/nginx/proxy"
          find "$PROXY_DIR" -path "*8084*" -type f 2>/dev/null | while read f; do
            if grep -q "proxy_pass" "$f" 2>/dev/null; then
              echo "fixing $f"
              sed -i "s|proxy_pass http://127.0.0.1:[0-9][0-9]*;|proxy_pass http://127.0.0.1:3006;|g" "$f"
            fi
          done
          find /www/server/nginx -path "*8084*" -type f 2>/dev/null | while read f; do
            if grep -q "proxy_pass" "$f" 2>/dev/null; then
              echo "fixing $f"
              sed -i "s|proxy_pass http://127.0.0.1:[0-9][0-9]*;|proxy_pass http://127.0.0.1:3006;|g" "$f"
            fi
          done

          # Reload Nginx without clearing cache files; batch deletion is intentionally avoided.
          # Force the public 8084 entry to this app; old BT-generated blocks can leave 8084 on a stale proxy target.
          echo  | base64 -d > /www/server/panel/vhost/nginx/0.0.0.0_8084.conf
          echo "Wrote forced 8084 reverse proxy config"

          nginx -t 2>&1
          nginx -s reload 2>/dev/null && echo "Nginx reloaded OK" || echo "Nginx reload skipped"

          echo "=== Host firewall 8084 allow ==="
          if command -v firewall-cmd >/dev/null 2>&1; then
            firewall-cmd --state >/dev/null 2>&1 && firewall-cmd --permanent --add-port=8084/tcp && firewall-cmd --reload || true
          fi
          if command -v ufw >/dev/null 2>&1; then
            ufw allow 8084/tcp || true
          fi

          echo "=== Nginx 8084 diagnostics ==="
          nginx -T 2>&1 | grep -nE "listen 8084|server_name|proxy_pass" | head -80 || true
          echo "=== Local app health ==="
          curl -i --max-time 15 http://127.0.0.1:3006/api/health || true
          echo "=== Local nginx health ==="
          curl -i --max-time 15 http://127.0.0.1:8084/api/health || true
          echo "=== Public port listener ==="
          ss -ltnp | grep -E ":3006|:8084" || true
          echo "=== Server public-ip health ==="
          curl -i --max-time 15 http://116.62.220.255:8084/api/health || true
          echo "=== Nginx 8084 access log tail ==="
          tail -40 /www/wwwlogs/0.0.0.0_8084.log 2>/dev/null || echo "no access log"
          echo "=== Nginx 8084 error log tail ==="
          tail -40 /www/wwwlogs/0.0.0.0_8084.error.log 2>/dev/null || echo "no error log"

          echo "Deploy done"
          '

      - name: Verify public URL from runner
        run: |
          echo "=== Runner public health check ==="
          curl -i --max-time 20 http://${{ secrets.ALIYUN_HOST }}:8084/api/health || true

      - name: Sync sensitive files to private backup
        if: success()
        env:
          SECRETS_PAT: ${{ secrets.SECRETS_REPO_PAT }}
        run: |
          git clone --depth 1 "https://oauth2:${SECRETS_PAT}@github.com/milaotou-tools/secrets.git" /tmp/secrets-backup
          mkdir -p /tmp/secrets-backup/title-clinic
          cp -v system-prompt.txt /tmp/secrets-backup/title-clinic/ 2>/dev/null || true
          cp -v expert-methodology.md /tmp/secrets-backup/title-clinic/ 2>/dev/null || true
          cd /tmp/secrets-backup
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to sync"
          else
            git commit -m "auto-sync title-clinic sensitive files"
            git push origin main
            echo "Synced to secrets repo"
          fi
          echo "Secret backup sync step done"
